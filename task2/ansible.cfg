[defaults]
# Инвентарь лежит рядом, поэтому пути относительные
inventory = inventory/hosts.yml

# Узлы кластера — контейнеры kind, SSH-ключей нет
host_key_checking = False

# Минимальные образы kind не содержат python3: первый playbook ставит его
# модулем raw, после чего используется этот интерпретатор
interpreter_python = /usr/bin/python3

# Вывод без цветовых кодов — так удобнее вставлять в отчёт
stdout_callback = default
deprecation_warnings = False
command_warnings = False

[ssh_connection]
# подключение идёт через docker exec, ssh-опции не используются,
# блок оставлен для наглядности структуры файла
pipelining = False
