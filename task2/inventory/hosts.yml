# Инвентарь: узлы кластера Kubernetes из лабораторной работы №4 (kind).
#
# Узлы kind — это контейнеры Docker, а не виртуальные машины: SSH-сервера в них нет.
# Поэтому используется подключаемый модуль community.docker.docker, который
# выполняет команды внутри контейнера через `docker exec`.
all:
  children:
    k8s:
      children:
        control_plane:
          hosts:
            lab4-control-plane:
        workers:
          hosts:
            lab4-worker:
            lab4-worker2:
      vars:
        ansible_connection: community.docker.docker
        ansible_host: "{{ inventory_hostname }}"
        ansible_user: root
        ansible_python_interpreter: /usr/bin/python3
        # В узлах kind прописан устаревший адрес прокси (127.0.0.1:54031),
        # из контейнера он недоступен. Переменные очищаются для задач пакетов.
        clear_proxy:
          http_proxy: ""
          https_proxy: ""
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
